<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>WebAR Poster Gallery</title>

<!-- 文字（Noto Sans JP）を読み込みます。ネットにつながっていなくても、別の文字で表示されるだけで動きます -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

<!-- 3Dの部品（A-Frame 1.5.0）。このまま変えないでください -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<!-- ============================================================
     ★★★ ここが「設定エリア」です ★★★
     生徒が書きかえるのは、基本的にこの四角の中だけ！
     書きかえるときは「 ' ' 」や「 , 」を消さないように気をつけてね。
     ※ 日本語は ja、英語は en のほうに書きます。
     ============================================================ -->
<script>
/* ------------------------------------------------------------
   (1) 展示会の名前（スタート画面に大きく出ます）
   ------------------------------------------------------------ */
const EXHIBITION_TITLE = { ja: '○○町 地域紹介ポスター展', en: 'Local Area Poster Exhibition' };
const EXHIBITION_SUB   = { ja: '○○高校 デザイン授業 作品',   en: 'Works by the ○○ High School design class' };

/* ------------------------------------------------------------
   (2) ポスター一覧
   1まいぶんが { ... }, のまとまりです。ふやすときは、まとまりごとコピーして
   うしろに貼りつけてください（最後にも , を忘れずに）。
     image       … 画像ファイルの名前（images フォルダの中に入れる）
     title       … ポスターのタイトル          （title_en … 英語版）
     author      … 制作した人の名前            （author_en … 英語版）
     description … 解説文                      （description_en … 英語版）
   ※ 英語版（_en）を書かなかったときは、日本語がそのまま出ます。
   ※ 画像が見つからないときは、タイトル入りの「仮ポスター」が自動で出ます。
   ※ 画像は A4たて（たて：よこ ＝ 1.41：1）で作ると、ぴったり入ります。
   ------------------------------------------------------------ */
const POSTERS = [
  { image: 'images/poster1.jpg', title: '海と港のまち',   author: '1年A組 山田 花子', description: '朝の港に並ぶ漁船と、新鮮な魚が自慢のまちを紹介します。市場は早朝がおすすめです。',
    title_en: 'Sea and Harbor Town', author_en: 'Hanako Yamada (Year 1, Class A)', description_en: 'A town proud of its fishing boats lined up at dawn and its fresh fish. The market is best visited early in the morning.' },
  { image: 'images/poster2.jpg', title: '歴史の坂道',     author: '1年A組 佐藤 太郎', description: '石だたみの坂と古い蔵が残る通りを、イラストで表現しました。散歩にぴったりです。',
    title_en: 'Historic Slope', author_en: 'Taro Sato (Year 1, Class A)', description_en: 'An illustration of a street with stone-paved slopes and old storehouses. Perfect for a relaxing walk.' },
  { image: 'images/poster3.jpg', title: 'おいしい名物',   author: '1年B組 鈴木 美咲', description: '地元でとれた野菜とお米を使った名物料理を紹介します。お店めぐりのヒントにどうぞ。',
    title_en: 'Local Delicacies', author_en: 'Misaki Suzuki (Year 1, Class B)', description_en: 'Specialty dishes made with local vegetables and rice. A handy guide for exploring local restaurants.' },
  { image: 'images/poster4.jpg', title: '夏まつり',       author: '1年B組 高橋 健',   description: 'まちじゅうが明るくなる夏まつり。おみこしと花火の楽しさを色でえがきました。',
    title_en: 'Summer Festival', author_en: 'Ken Takahashi (Year 1, Class B)', description_en: 'The whole town lights up for the summer festival. The fun of portable shrines and fireworks, painted in color.' },
  { image: 'images/poster5.jpg', title: '緑の山あるき',   author: '1年C組 田中 結衣', description: '登山道から見える景色と、季節の花をまとめました。春と秋が特におすすめです。',
    title_en: 'Green Mountain Walk', author_en: 'Yui Tanaka (Year 1, Class C)', description_en: 'Views from the hiking trail and seasonal flowers. Spring and autumn are especially recommended.' },
  { image: 'images/poster6.jpg', title: 'まちの人びと',   author: '1年C組 伊藤 蓮',   description: 'あたたかい人たちが暮らすまちの魅力を、イラストと言葉で伝えます。',
    title_en: 'People of the Town', author_en: 'Ren Ito (Year 1, Class C)', description_en: 'The charm of a town where warm-hearted people live, told through illustrations and words.' }
];

/* ------------------------------------------------------------
   (3) ポスターを並べる「間隔の倍率」
   1.0 = ふつう / 1.5 = ひろびろ / 0.8 = ぎゅっと
   ------------------------------------------------------------ */
const GAP = 1.0;

/* ------------------------------------------------------------
   (4) あるきモードの調整（iPhoneなど）
   STEP_LENGTH    … 1歩で進む距離（メートル）。大きいほど1歩で遠くへ進む
   STEP_THRESHOLD … 歩数をひろう「感度」。数字を小さくすると反応しやすく、
                    大きくすると反応しにくくなる（歩いていないのに進むなら大きく）
   ------------------------------------------------------------ */
const STEP_LENGTH    = 0.9;
const STEP_THRESHOLD = 0.9;

/* ------------------------------------------------------------
   (5) 空間にうかべる大きな3Dオブジェクト（かんたんな形）
     shape … 形：sphere(球) box(はこ) torus(ドーナツ) torusKnot(むすび目)
                  icosahedron(20面体) octahedron(8面体) dodecahedron(12面体)
                  tetrahedron(4面体) cone(円すい) cylinder(円ばしら)
     size  … 大きさ（メートル）。0.6〜1.4 の間で決めてね
     color … 色（#ff6fa5 のような色コード）
     style … 見た目：glossy(つや) / wire(ワイヤー) / glass(半透明)
   ※ 置く場所は、ポスターと重ならないように自動で決まります。
   ------------------------------------------------------------ */
const FLOATERS = [
  { shape: 'sphere',       size: 1.2, color: '#ff6fa5', style: 'glossy' },
  { shape: 'torus',        size: 1.0, color: '#6c8cff', style: 'wire'   },
  { shape: 'icosahedron',  size: 1.3, color: '#7af0d0', style: 'glass'  },
  { shape: 'box',          size: 0.9, color: '#ffd166', style: 'glossy' },
  { shape: 'torusKnot',    size: 1.1, color: '#c084fc', style: 'glossy' },
  { shape: 'octahedron',   size: 0.8, color: '#ffffff', style: 'wire'   },
  { shape: 'dodecahedron', size: 1.4, color: '#ff9f6b', style: 'glass'  },
  { shape: 'cone',         size: 1.0, color: '#4ade80', style: 'glossy' },
  { shape: 'sphere',       size: 0.7, color: '#60a5fa', style: 'glass'  },
  { shape: 'tetrahedron',  size: 0.9, color: '#f472b6', style: 'wire'   },
  { shape: 'cylinder',     size: 0.8, color: '#fde047', style: 'glossy' },
  { shape: 'torus',        size: 1.4, color: '#34d399', style: 'glass'  }
];

/* ------------------------------------------------------------
   (6) 薩摩川内市の「見どころ」3Dオブジェクト
   ここに書いた数だけ、空間にうかびます。タップすると説明カードが出ます。
     model … 見どころの種類（下の LOCAL_SPOTS の名前のどれか）
     size  … 大きさ（メートル）0.6〜1.4
   同じ model を何度書いてもOK（大きさを変えると、ちがう見た目になります）。
   ------------------------------------------------------------ */
const LOCAL_FLOATERS = [
  { model: 'tsunahiki',  size: 1.4 },
  { model: 'cliff',      size: 1.3 },
  { model: 'lily',       size: 1.1 },
  { model: 'lagoon',     size: 1.2 },
  { model: 'river',      size: 1.3 },
  { model: 'samurai',    size: 1.2 },
  { model: 'onsen',      size: 1.0 },
  { model: 'shinkansen', size: 1.4 },
  { model: 'planet',     size: 1.0 },
  { model: 'dragonfly',  size: 1.0 },
  { model: 'bridge',     size: 1.4 },
  { model: 'ferry',      size: 1.3 },
  { model: 'lily',       size: 0.8 },
  { model: 'dragonfly',  size: 0.7 },
  { model: 'tsunahiki',  size: 0.9 }
];

/* 見どころの名前と説明（日本語 ja ／ 英語 en）。公開する前に、市の公式情報で内容を確かめてね */
const LOCAL_SPOTS = {
  tsunahiki: {
    ja: { name: '川内大綱引', desc: '毎年秋に行われる、薩摩川内市を代表する伝統行事。大きな綱を二手に分かれて引き合う、迫力いっぱいの勝負です。' },
    en: { name: 'Sendai Otsunahiki (Giant Tug-of-War)', desc: 'A traditional autumn event and a symbol of Satsumasendai. Two teams pull a huge rope in a thrilling contest.' } },
  cliff: {
    ja: { name: '甑島の鹿島断崖', desc: '甑島の海岸にそびえる迫力ある断崖。海の青と岩の景色のコントラストが見どころです。' },
    en: { name: 'Kashima Cliffs, Koshikijima', desc: 'Dramatic sea cliffs along the coast of the Koshikijima islands. Enjoy the contrast of blue sea and rugged rock.' } },
  lily: {
    ja: { name: '甑島のカノコユリ', desc: '夏に咲く、鹿の子（かのこ）模様の花。甑島を代表する花として知られています。' },
    en: { name: 'Kanoko Lily of Koshikijima', desc: 'A spotted lily that blooms in summer, known as a flower of the Koshikijima islands.' } },
  lagoon: {
    ja: { name: '長目の浜', desc: '上甑島にある景勝地。砂の浜が海と湖のようなラグーンを分けている、ふしぎな景色です。' },
    en: { name: 'Nagame-no-hama Beach', desc: 'A scenic spot on Kamikoshiki island where a sandbar separates lagoon-like lakes from the sea.' } },
  river: {
    ja: { name: '川内川', desc: '市の中を流れて東シナ海にそそぐ、大きな川。まちの暮らしと歴史を見守ってきました。' },
    en: { name: 'Sendai River', desc: 'A large river that flows through the city to the East China Sea, watching over local life and history.' } },
  samurai: {
    ja: { name: '入来麓の武家屋敷', desc: '石垣と生け垣の道に、江戸時代の武家屋敷が残る町並み。ゆっくり歩いて楽しめます。' },
    en: { name: 'Iriki Fumoto Samurai Residences', desc: 'A townscape of stone walls and hedges where samurai houses from the Edo period remain. Great for a slow stroll.' } },
  onsen: {
    ja: { name: '薩摩川内の温泉', desc: '市内には温泉地がいくつもあります。観光の疲れをのんびりいやせます。' },
    en: { name: 'Hot Springs', desc: 'Satsumasendai has several hot spring areas, perfect for relaxing after a day of sightseeing.' } },
  shinkansen: {
    ja: { name: '九州新幹線 川内駅', desc: '九州新幹線が止まる川内駅。鹿児島方面や博多方面へのアクセスに便利です。' },
    en: { name: 'Kyushu Shinkansen – Sendai Station', desc: 'Sendai Station is a stop on the Kyushu Shinkansen, with easy access to Kagoshima and Hakata.' } },
  planet: {
    ja: { name: 'せんだい宇宙館', desc: '星や宇宙について楽しく学べる施設です。' },
    en: { name: 'Sendai Space Museum', desc: 'A facility where you can enjoy learning about stars and space.' } },
  dragonfly: {
    ja: { name: '藺牟田池とベッコウトンボ', desc: '火山のくぼ地にできた池。まわりの湿地は、ベッコウトンボなど貴重な生きものの住みかです。' },
    en: { name: 'Imuta Pond and the Bekko Dragonfly', desc: 'A pond formed in a volcanic crater. The surrounding wetland is a precious habitat for rare creatures such as the Bekko dragonfly.' } },
  bridge: {
    ja: { name: '甑大橋', desc: '上甑島と中甑島をつなぐ橋。島めぐりの旅がぐっと楽になりました。' },
    en: { name: 'Koshiki Ohashi Bridge', desc: 'A bridge connecting Kamikoshiki and Nakakoshiki islands, making island tours much easier.' } },
  ferry: {
    ja: { name: '甑島へのフェリー', desc: '川内港などから、フェリーや高速船で甑島へ渡れます。船旅も楽しみのひとつです。' },
    en: { name: 'Ferry to Koshikijima', desc: 'You can cross to the Koshikijima islands by ferry or high-speed boat from ports such as Sendai Port. The sea trip is part of the fun.' } }
};

/* ------------------------------------------------------------
   (7) ポスターの真上で回る「アイキャッチ」の形（ポスターの順番にくり返し使います）
   ------------------------------------------------------------ */
const EYECATCHES = ['torus', 'icosahedron', 'octahedron', 'torusKnot', 'dodecahedron', 'sphere'];

/* ------------------------------------------------------------
   (8) そのほか（ふつうは変えなくてOK）
   STICK_SPEED   … スティックを いっぱいに倒したときの速さ（メートル／秒）
   STUCK_SECONDS … ARが始まってから、スマホの位置が動かない時間がこの秒数つづくと知らせる
   BGM_VOLUME    … BGMの最初の音量（0〜1）
   BUILD_NUMBER  … 公開するたびに書きかえると、新しい版か見分けやすい
   ------------------------------------------------------------ */
const STICK_SPEED   = 1.6;
const STUCK_SECONDS = 7;
const BGM_VOLUME    = 0.6;
const BUILD_NUMBER  = 'build 2026.11.12-03';
/* ★★★ 設定エリアはここまで ★★★ */
</script>

<style>
/* ===== 見た目（デザイン）の設定 ===== */
:root{
  --active-bg:linear-gradient(135deg,#4f6df0,#d64a93);   /* えらんでいるボタンの色（白い文字が読みやすい濃さ） */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* 夜モードの色 */
body[data-theme="night"]{
  --text:#ffffff; --glass:rgba(16,22,46,.76); --glass-line:rgba(255,255,255,.26);
  --panel:rgba(14,19,42,.96); --seg-bg:rgba(255,255,255,.12);
  --bar-bg:rgba(12,16,36,.90); --bar-item:rgba(255,255,255,.10); --card-bg:rgba(18,24,50,.92);
  --start-bg:radial-gradient(circle at 20% 15%,rgba(124,156,255,.5),transparent 45%),radial-gradient(circle at 85% 80%,rgba(255,122,182,.4),transparent 45%),linear-gradient(160deg,#0d1226,#1b1440);
}
/* 昼モードの色 */
body[data-theme="day"]{
  --text:#1a2040; --glass:rgba(255,255,255,.86); --glass-line:rgba(26,32,64,.16);
  --panel:rgba(255,255,255,.97); --seg-bg:rgba(26,32,64,.08);
  --bar-bg:rgba(255,255,255,.94); --bar-item:rgba(26,32,64,.07); --card-bg:rgba(255,255,255,.95);
  --start-bg:radial-gradient(circle at 20% 15%,rgba(124,180,255,.55),transparent 50%),radial-gradient(circle at 85% 80%,rgba(255,180,210,.55),transparent 50%),linear-gradient(160deg,#dcebff,#fff1e6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:var(--text);
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;
}
a-scene{position:fixed!important;inset:0;z-index:1;}
a-scene .a-canvas{background:transparent!important;}
.a-enter-vr,.a-enter-ar,.a-enter-vr-button,.a-enter-ar-button{display:none!important;}
#camVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none;background:#000;}
body[data-theme="night"] #camVideo{filter:brightness(.62) saturate(.9) contrast(1.05);}   /* 夜モード：カメラ映像を少し暗く */
#ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:var(--text);}
#ui .ui-part,#tapLayer{pointer-events:auto;}
#tapLayer{position:absolute;inset:0;}

.glass{
  background:var(--glass);border:1px solid var(--glass-line);color:var(--text);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.25);
}
.hud{display:none;}
body.running .hud{display:flex;}
.camonly{display:none;}
body.mode-camera.running .camonly{display:flex;}
.camonly-block{display:none;}
body.mode-camera.running .camonly-block{display:block;}

/* 左上：いまのモードと理由（メニューボタンにかぶらない幅） */
#modeBadge{
  position:absolute;z-index:55;top:calc(var(--safe-t) + 10px);left:10px;max-width:calc(100vw - 80px);
  padding:9px 14px;display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1.5;
}
#modeName{font-weight:700;font-size:13px;display:flex;align-items:flex-start;gap:6px;}
#modeName::before{content:'';flex:none;margin-top:5px;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;}
#modeReason{opacity:.9;}

/* 右上：ハンバーガーメニューのボタン */
#menuBtn{
  position:absolute;z-index:56;top:calc(var(--safe-t) + 10px);right:10px;width:46px;height:46px;padding:0;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;border-radius:16px;font:inherit;
}
#menuBtn span{display:block;width:20px;height:2.5px;border-radius:2px;background:var(--text);}
#menuBtn:active{transform:scale(.94);}
/* 右上（メニューの下）：歩数 */
#stepChip{position:absolute;top:calc(var(--safe-t) + 64px);right:10px;padding:7px 12px;font-size:13px;font-weight:700;align-items:center;gap:6px;}

/* 赤い帯（エラー）：タップするまで消えない */
#errBar{
  position:absolute;z-index:60;left:10px;right:10px;top:calc(var(--safe-t) + 110px);display:none;
  background:rgba(200,25,25,.96);color:#fff;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.55;
  white-space:pre-line;word-break:break-all;box-shadow:0 8px 24px rgba(0,0,0,.35);
}
#errBar.show{display:block;}

/* ひとことメッセージ（スティックより上に出す） */
#toast{
  position:absolute;z-index:58;left:50%;bottom:calc(var(--safe-b) + 236px);transform:translate(-50%,8px);
  max-width:min(88vw,460px);padding:10px 16px;font-size:13px;line-height:1.55;text-align:center;
  opacity:0;pointer-events:none!important;transition:opacity .3s,transform .3s;
}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* 左下：アナログスティック */
#stick{
  position:absolute;left:18px;bottom:calc(var(--safe-b) + 100px);width:120px;height:120px;border-radius:50%;
  display:none;touch-action:none;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 24px rgba(0,0,0,.3);
}
body.stick-on.running #stick{display:block;}
#stickKnob{
  position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
  background:var(--active-bg);box-shadow:0 4px 14px rgba(0,0,0,.4);
}

/* 下：レイアウト切りかえ（文字を大きく・背景を濃くして読みやすく） */
#layoutBar{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 12px);
  width:min(94vw,430px);padding:6px;gap:6px;border-radius:22px;
  background:var(--bar-bg);border:1px solid var(--glass-line);box-shadow:0 10px 30px rgba(0,0,0,.35);
}
#layoutBar button{
  flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font:inherit;font-size:13.5px;font-weight:700;letter-spacing:.02em;color:var(--text);
  background:var(--bar-item);border:0;border-radius:16px;padding:8px 4px;cursor:pointer;transition:background .25s,transform .1s;
}
#layoutBar button:active{transform:scale(.96);}
#layoutBar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;}
#layoutBar button.active{background:var(--active-bg);color:#fff;box-shadow:0 4px 14px rgba(79,109,240,.5);}

/* ハンバーガーメニュー本体 */
#menu{position:absolute;inset:0;z-index:45;visibility:hidden;transition:visibility 0s linear .3s;}
#menu.open{visibility:visible;transition-delay:0s;}
.menu-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .3s;}
#menu.open .menu-backdrop{opacity:1;}
.menu-panel{
  position:absolute;top:0;right:0;bottom:0;width:min(88vw,350px);overflow-y:auto;touch-action:pan-y;
  padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 24px);
  background:var(--panel);color:var(--text);border-left:1px solid var(--glass-line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transform:translateX(100%);transition:transform .3s ease;box-shadow:-10px 0 30px rgba(0,0,0,.3);
}
#menu.open .menu-panel{transform:none;}
.menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.menu-head h2{margin:0;font-size:20px;font-weight:900;}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;font:inherit;font-size:18px;color:var(--text);background:var(--seg-bg);cursor:pointer;}
.menu-sec{padding:14px 0;border-bottom:1px solid var(--glass-line);}
.menu-sec:last-child{border-bottom:0;}
.menu-sec h3{margin:0 0 9px;font-size:12px;letter-spacing:.06em;opacity:.75;font-weight:700;}
.menu-sec p{margin:0;font-size:13px;line-height:1.75;opacity:.92;}
.seg{display:flex;background:var(--seg-bg);border-radius:14px;padding:3px;gap:2px;}
.seg button{
  flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;font-weight:700;
  padding:10px 8px;border-radius:11px;cursor:pointer;
}
.seg button.on{background:var(--active-bg);color:#fff;}
.menu-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;
  border:1px solid var(--glass-line);background:var(--seg-bg);color:var(--text);font:inherit;font-weight:700;font-size:14px;cursor:pointer;
}
.menu-btn:active{transform:scale(.98);}
.menu-btn.primary,.menu-btn[aria-pressed="true"]{background:var(--active-bg);color:#fff;border-color:transparent;}
.row{display:flex;gap:10px;align-items:center;}
.row .menu-btn{width:auto;flex:none;min-width:96px;}
#bgmVol{flex:1;min-width:0;accent-color:#6c8cff;touch-action:pan-x;height:32px;}

/* ポスター・見どころをタップしたときのカード */
#card{
  position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(8,10,24,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
#card.show{display:flex;animation:fadeIn .25s ease;}
.card-inner{
  width:100%;max-width:440px;max-height:calc(100% - 20px);overflow-y:auto;touch-action:pan-y;
  padding:16px;border-radius:26px;background:var(--card-bg);color:var(--text);
}
#cardImg{width:100%;max-height:42vh;object-fit:contain;border-radius:14px;background:#fff;display:block;}
.card-no{display:inline-block;margin:14px 0 6px;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;background:var(--active-bg);color:#fff;}
#cardTitle{margin:2px 0 2px;font-size:22px;font-weight:900;line-height:1.35;}
#cardAuthor{margin:0 0 10px;font-size:13px;opacity:.85;}
#cardDesc{margin:0 0 14px;font-size:14px;line-height:1.75;}

/* スタート画面 */
#start{
  position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:70px 18px 24px;text-align:center;background:var(--start-bg);color:var(--text);overflow-y:auto;
}
#start.hide{display:none;}
.start-card{width:100%;max-width:420px;padding:26px 22px;border-radius:28px;}
.start-opts{display:flex;gap:8px;margin-bottom:16px;}
.start-opts .seg{flex:1;}
.start-tag{display:inline-block;font-size:11px;letter-spacing:.14em;padding:4px 12px;border-radius:99px;background:var(--seg-bg);}
#startTitle{margin:14px 0 6px;font-size:26px;line-height:1.35;font-weight:900;}
#startSub{margin:0 0 18px;font-size:14px;opacity:.85;}
.start-list{margin:0 0 20px;padding:0;list-style:none;font-size:13px;line-height:1.7;text-align:left;opacity:.95;}
.start-list li{padding-left:1.4em;position:relative;}
.start-list li::before{content:'●';position:absolute;left:0;color:#d64a93;font-size:10px;top:.25em;}
#startBtn{
  width:100%;font:inherit;font-size:17px;font-weight:900;color:#fff;border:0;border-radius:18px;padding:16px;cursor:pointer;
  background:var(--active-bg);box-shadow:0 10px 28px rgba(79,109,240,.45);
}
#startBtn:disabled{opacity:.65;}
#startBtn:active{transform:scale(.98);}
.diag{margin-top:16px;font-size:12px;line-height:1.7;opacity:.85;max-width:420px;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

<!-- A-Frame に「毎フレーム動かす係」を登録（アニメーション用）。中身は下のほうの <script> にあります -->
<script>
AFRAME.registerComponent('gallery-loop', {
  tick: function (time, dt) { if (window.__galleryTick) window.__galleryTick(time, dt); }
});
</script>

/* ============================================================
   1. 端末の判定
   ※ iPhone かどうかは「機種名（ユーザーエージェント）」で判定します。
   ============================================================ */
const ua = navigator.userAgent || '';
const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(ua);
const isChrome = /Chrome\//.test(ua) && !/Edg\/|OPR\/|SamsungBrowser|CriOS/.test(ua);
let arInfo = null;

async function checkAR() {
  if (isIOS) return { ok: false, short: 'short.ios', why: 'why.ios', p: {} };
  if (!isAndroid) return { ok: false, short: 'short.notAndroid', why: 'why.notAndroid', p: {} };
  if (!isChrome) return { ok: false, short: 'short.notChrome', why: 'why.notChrome', p: {} };
  if (!navigator.xr) return { ok: false, short: 'short.noXR', why: 'why.noXR', p: {} };
  try {
    const ok = await navigator.xr.isSessionSupported('immersive-ar');
    return ok ? { ok: true, short: 'short.ok', why: 'why.arOk', p: {} }
              : { ok: false, short: 'short.noARCore', why: 'why.noARCore', p: {} };
  } catch (e) {
    return { ok: false, short: 'short.checkErr', why: 'why.checkErr', p: { name: (e && e.name) || 'Error' } };
  }
}

/* ============================================================
   3. ポスターの画像（なければ仮ポスターを自動で作る）
   ============================================================ */
function loadImage(path) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('not found: ' + path));
    img.src = path;
  });
}
function fitImageToDataURL(img) {
  const W = 800, H = 1131, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  const s = Math.min(W / img.naturalWidth, H / img.naturalHeight);
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  return c.toDataURL('image/jpeg', 0.9);
}
function fontsReady() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  return withTimeout(document.fonts.load('900 40px "Noto Sans JP"', 'あ'), 2500).catch(() => {});
}
function roundRectPath(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function wrapLines(g, text, maxW) {
  const lines = []; let cur = '';
  for (const ch of String(text)) {
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    const tt = cur + ch;
    if (g.measureText(tt).width > maxW && cur) { lines.push(cur); cur = ch; } else cur = tt;
  }
  if (cur) lines.push(cur);
  return lines;
}
function makePlaceholderDataURL(i, title, author) {
  const W = 800, H = 1131, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const hue = (i * 52 + 210) % 360;
  const grad = g.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, 'hsl(' + hue + ',78%,62%)');
  grad.addColorStop(1, 'hsl(' + ((hue + 55) % 360) + ',82%,42%)');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  g.globalAlpha = 0.18; g.fillStyle = '#fff';
  g.beginPath(); g.arc(W * 0.85, H * 0.12, 230, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(W * 0.1, H * 0.9, 300, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(255,255,255,.92)'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.font = '900 150px "Noto Sans JP",sans-serif';
  g.fillText(String(i + 1).padStart(2, '0'), 60, 210);
  g.fillStyle = 'rgba(255,255,255,.93)'; roundRectPath(g, 50, 330, W - 100, 470, 36); g.fill();
  g.fillStyle = '#1d2340'; g.textAlign = 'center';
  let size = 96, lines = [];
  for (; size >= 44; size -= 6) {
    g.font = '900 ' + size + 'px "Noto Sans JP",sans-serif';
    lines = wrapLines(g, title || '', W - 190);
    if (lines.length * size * 1.3 <= 400) break;
  }
  const blockH = lines.length * size * 1.3;
  lines.forEach((ln, k) => g.fillText(ln, W / 2, 330 + (470 - blockH) / 2 + size * 1.02 + k * size * 1.3));
  g.fillStyle = '#fff'; g.font = '700 38px "Noto Sans JP",sans-serif';
  g.fillText(t('card.by') + (author || ''), W / 2, 920);
  g.globalAlpha = 0.8; g.font = '400 26px "Noto Sans JP",sans-serif';
  g.fillText('(placeholder)', W / 2, 1040);
  return c.toDataURL('image/png');
}
async function loadPosterTexture(i, d) {
  if (d.image) {
    try {
      const img = await withTimeout(loadImage(d.image), 8000);
      try { return { src: fitImageToDataURL(img), placeholder: false }; } catch (e) { return { src: d.image, placeholder: false }; }
    } catch (e) { /* 画像が無い → 仮ポスターへ */ }
  }
  await fontsReady();
  return { src: makePlaceholderDataURL(i, pickP(d, 'title'), pickP(d, 'author')), placeholder: true };
}

/* ============================================================
   4. かんたんな3Dオブジェクトの形と見た目
   ============================================================ */
function geometryFor(shape, s) {
  const r = s / 2;
  switch (shape) {
    case 'box':          return { primitive: 'box', width: s * 0.85, height: s * 0.85, depth: s * 0.85 };
    case 'torus':        return { primitive: 'torus', radius: r * 0.72, radiusTubular: r * 0.28, segmentsRadial: 16, segmentsTubular: 40 };
    case 'torusKnot':    return { primitive: 'torusKnot', radius: r * 0.65, radiusTubular: r * 0.2, segmentsRadial: 12, segmentsTubular: 80, p: 2, q: 3 };
    case 'icosahedron':  return { primitive: 'icosahedron', radius: r };
    case 'octahedron':   return { primitive: 'octahedron', radius: r };
    case 'dodecahedron': return { primitive: 'dodecahedron', radius: r };
    case 'tetrahedron':  return { primitive: 'tetrahedron', radius: r };
    case 'cone':         return { primitive: 'cone', radiusBottom: r * 0.8, radiusTop: 0, height: s };
    case 'cylinder':     return { primitive: 'cylinder', radius: r * 0.6, height: s * 0.9 };
    default:             return { primitive: 'sphere', radius: r, segmentsWidth: 32, segmentsHeight: 24 };
  }
}
function materialFor(style, color) {
  if (style === 'wire')  return { shader: 'flat', color: color, wireframe: true };
  if (style === 'glass') return { shader: 'standard', color: color, opacity: 0.45, transparent: true, metalness: 0.1, roughness: 0.05, side: 'double' };
  return { shader: 'standard', color: color, metalness: 0.35, roughness: 0.18 };
}

   6. ポスターと3Dオブジェクトを作る

const units = [];      // ポスター
const floaters = [];   // 空間にうかぶ3Dオブジェクト（かんたんな形 ＋ 薩摩川内の見どころ）

function createPosterUnit(i, data) {
  const outer = mk(), bob = mk(), frame = mk(), plane = mk(), eyeHolder = mk(), eyeSpin = mk();
  frame.setAttribute('geometry', { primitive: 'box', width: POSTER_W + 0.12, height: POSTER_H + 0.12, depth: 0.05 });
  frame.setAttribute('material', { shader: 'standard', color: '#ffffff', roughness: 0.6, metalness: 0 });
  plane.setAttribute('geometry', { primitive: 'plane', width: POSTER_W, height: POSTER_H });
  plane.setAttribute('position', { x: 0, y: 0, z: 0.027 });
  plane.setAttribute('material', { shader: 'flat', color: '#e8ebf5' });
  eyeHolder.setAttribute('position', { x: 0, y: POSTER_H / 2 + 0.6, z: 0 });
  const eyeColor = hslToHex((i * 52 + 210) % 360, 85, 62);
  eyeSpin.setAttribute('geometry', geometryFor(EYECATCHES[i % EYECATCHES.length], 0.38));
  eyeSpin.setAttribute('material', materialFor('glossy', eyeColor));
  eyeHolder.appendChild(eyeSpin);
  bob.appendChild(frame); bob.appendChild(plane); bob.appendChild(eyeHolder);
  outer.appendChild(bob);
  galleryEl.appendChild(outer);

  const u = {
    i: i, data: data, outer: outer, bob: bob, frame: frame, plane: plane, eyeSpin: eyeSpin, eyeColor: eyeColor,
    cardSrc: '', placeholder: false, phase: i * 1.7, delay: 0.15 * i,
    cur: { x: 0, y: POSTER_Y, z: 0, yaw: 0 }, tg: { x: 0, y: POSTER_Y, z: 0, yaw: 0 }
  };
  loadPosterTexture(i, data).then((res) => {
    // ★ 画像のデータURLは、文字列ではなく「オブジェクト形式」で渡す（セミコロンで壊れないように）
    plane.setAttribute('material', { src: res.src, shader: 'flat' });
    u.cardSrc = res.src; u.placeholder = res.placeholder;
  });

function posterTargets(name) {
  const n = POSTERS.length, out = [];
  for (let i = 0; i < n; i++) {
    if (name === 'circle') {

      const R = Math.max(2.5, n * 0.45) * GAP, a = (i / n) * Math.PI * 2;
      const x = R * Math.sin(a), z = -R * Math.cos(a);

    } else if (name === 'street') {
      // ストリート型：通路の半分の幅1.7m、前後の間隔2.2m
      const half = 1.7 * GAP, pitch = 2.2 * GAP, side = (i % 2 === 0) ? -1 : 1, row = Math.floor(i / 2);
      out.push({ x: side * half, y: POSTER_Y, z: -(row + 1) * pitch, yaw: side < 0 ? Math.PI / 2 - 0.2 : -Math.PI / 2 + 0.2 });
    } else {

      const dx = 2.0 * GAP, dz = 2.6 * GAP, row = Math.floor(i / 3), col = i % 3;
      const cnt = Math.min(3, n - row * 3);
      out.push({ x: (col - (cnt - 1) / 2) * dx, y: POSTER_Y, z: -(row + 1) * dz, yaw: 0 });
    }

}

// 3Dオブジェクトを、ポスターに重ならない場所へ置く（レイアウトごとに1回だけ計算）
const floaterCache = {};
function floaterTargets(name, pt) {
  if (floaterCache[name]) return floaterCache[name];
  const rng = mulberry32({ circle: 11, street: 23, grid: 37 }[name] || 5);
  let minX = 0, maxX = 0, minZ = 0, maxZ = 0;
  pt.forEach((p) => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); });
  const margin = 3.6, placed = [], out = new Array(floaters.length);
  const order = floaters.map((f, i) => i).sort((a, b) => floaters[b].size - floaters[a].size);
  for (const idx of order) {
    const r = floaters[idx].size / 2;
    let pos = null;
    for (let at = 0; at < 600 && !pos; at++) {
      const sp = 1 + at / 150;                                   // 見つからなければ探す範囲を広げる
      const x = minX - margin * sp + rng() * ((maxX - minX) + 2 * margin * sp);
      const z = minZ - margin * sp + rng() * ((maxZ - minZ) + 2 * margin * sp);
      const y = (r + 0.6) + rng() * (3.4 - (r + 0.6));
      if (Math.hypot(x, z) < 1.7 + r) continue;                  // 自分のすぐそばには置かない
      let ok = true;
      for (const p of pt) { if (Math.hypot(x - p.x, z - p.z) < r + 1.0) { ok = false; break; } }   // ポスターと重ならない
      if (!ok) continue;
      if (name === 'street' && Math.abs(x) < 1.0 + r && z > minZ - 2) continue;                    // 通路はあけておく
      for (const q of placed) { if (Math.hypot(x - q.x, y - q.y, z - q.z) < r + q.r + 0.35) { ok = false; break; } }
      if (ok) pos = { x: x, y: y, z: z };

    placed.push({ x: pos.x, y: pos.y, z: pos.z, r: r });

}

window.__galleryTick = function (timeMs, dtMs) {
  if (!state.running) return;
  const dt = Math.min(dtMs / 1000, 0.1), T = nowS();
  const renderer = sceneEl.renderer;
  const inXR = !!(renderer && renderer.xr && renderer.xr.isPresenting);

  }

  // (c) 移動：スティック ＋ 歩数ぶん

    rp.z += (f.z * fwd + (f.x) * rgt) * spd * dt;

    pendingMove.multiplyScalar(1 - k);
  }

  if (!a || a.x == null) return;
  const m = Math.hypot(a.x, a.y, a.z);
  gBase += (m - gBase) * 0.05;
  accSm += ((m - gBase) - accSm) * 0.35;
  const now = performance.now();
  if (stepArmed && accSm > STEP_THRESHOLD && now - lastStepMs > STEP_MIN_INTERVAL) { stepArmed = false; lastStepMs = now; doStep(); }
  else if (!stepArmed && accSm < STEP_THRESHOLD * 0.35) stepArmed = true;
}
function doStep() {
  if (!state.running || state.arActive) return;
  const h = getHeading(), sign = state.backward ? -1 : 1;
  pendingMove.x += h.x * STEP_LENGTH * sign;
  pendingMove.z += h.z * STEP_LENGTH * sign;
  state.steps++; $('#stepCount').textContent = state.steps;
}

/* ============================================================
   12. AR（WebXR）の開始
   ============================================================ */
let xrPatched = false;
function patchXR() {
  if (xrPatched || !navigator.xr) return; xrPatched = true;
  const orig = navigator.xr.requestSession.bind(navigator.xr);
  // A-Frame の enterAR() は失敗しても何も言わず止まることがある → requestSession を包んで失敗を捕まえる
  navigator.xr.requestSession = function (mode, init) {
    init = init || {};
    if (mode === 'immersive-ar') {
      init.requiredFeatures = ['local'];
      const opt = (init.optionalFeatures || []).filter((f) => f !== 'local-floor');
      if (opt.indexOf('dom-overlay') < 0) opt.push('dom-overlay');
      init.optionalFeatures = opt;
      init.domOverlay = { root: uiEl };
    }
    return orig(mode, init).then((s) => s, (err) => { onARFailed(t('err.ar'), err); throw err; });
  };
}
function onARFailed(title, err) {
  showError(title, err);
  if (state.arResolve) { const r = state.arResolve; state.arResolve = null; r(false); }
}
function tryEnterAR() {
  return new Promise((resolve) => {
    state.wantAR = true; patchXR();
    const timer = setTimeout(() => onARFailed(t('err.arTimeout'), { name: 'Timeout', message: '' }), 25000);
    state.arResolve = (v) => { clearTimeout(timer); resolve(v); };
    try {
      const p = sceneEl.enterAR();
      if (p && typeof p.catch === 'function') p.catch((err) => onARFailed(t('err.ar'), err));
    } catch (err) { onARFailed(t('err.ar'), err); }
  });
}
sceneEl.addEventListener('enter-vr', () => {
  if (state.wantAR && (sceneEl.is('ar-mode') || (sceneEl.renderer && sceneEl.renderer.xr.isPresenting))) onARStarted();
});
sceneEl.addEventListener('exit-vr', () => {
  if (!state.arActive) return;
  state.arActive = false; state.running = false; state.wantAR = false;
  document.body.classList.remove('running', 'stick-on');
  $('#start').classList.remove('hide');
  state.started = false; state.startLabel = 'start.retry';
  $('#startBtn').disabled = false; renderStartBtn();
  showToast(t('toast.arEnded'));
});
function applyARHeight() {                       // AR開始後：カメラ位置を0に、リグの高さを1.4mに
  camEl.setAttribute('position', '0 0 0');
  camEl.object3D.position.set(0, 0, 0);
  rigEl.object3D.position.y = EYE_HEIGHT;
}
function onARStarted() {
  if (state.arActive) return;
  state.arActive = true; state.mode = 'ar';
  stopCamera(); videoEl.style.display = 'none';
  camEl.object3D.quaternion.identity();
  applyARHeight(); setTimeout(applyARHeight, 400); setTimeout(applyARHeight, 1500);
  $('#start').classList.add('hide');
  document.body.classList.add('running'); document.body.classList.remove('mode-camera');
  state.stickOn = false; document.body.classList.remove('stick-on');
  setBadge('mode.ar', ['why.arOk']);
  state.running = true; state.appearAt = nowS();
  state.recenterAt = nowS() + 0.8;               // 開始直後に1回、自動で再配置
  state.watch = { t0: nowS(), base: null, max: 0, t1: 0 };
  if (state.arResolve) { const r = state.arResolve; state.arResolve = null; r(true); }
  showToast(t('toast.arStart'), 5000);
}

/* ============================================================
   13. カメラ映像＋ジャイロのモード（iPhoneなど）
   ============================================================ */
function stopCamera() { if (camStream) { camStream.getTracks().forEach((tr) => tr.stop()); camStream = null; } }
async function startCameraMode(permP, reasonKeys) {
  state.mode = 'camera';
  setBadge('mode.cam', reasonKeys, arInfo ? arInfo.p : {});
  $('#start').classList.add('hide');
  document.body.classList.add('running', 'mode-camera');

  const perm = await permP;
  if (perm === 'denied') showToast(t('toast.sensorDenied'), 8000);
  startSensors();

  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    videoEl.srcObject = camStream; videoEl.style.display = 'block';
    await videoEl.play().catch(() => {});
  } catch (e) { showError(t('err.cam'), e); }

  rigEl.object3D.position.y = EYE_HEIGHT;
  camEl.object3D.position.set(0, 0, 0);
  state.stickOn = true; document.body.classList.add('stick-on');
  state.running = true; state.appearAt = nowS();
  state.recenterAt = nowS() + 0.5;
  showToast(t('toast.camStart'), 7000);

  setTimeout(() => {                             // ジャイロが動いているか確認
    if (!gyro.has) setBadge('mode.noGyro', ['why.noGyro']);
  }, 2500);
}

/* ============================================================
   14. タップ判定（自前のレイキャスト）／ドラッグで見回し
   ============================================================ */
const raycaster = new THREE.Raycaster();
function handleTap(x, y) {
  if (!state.running || state.card || state.menuOpen) return;
  const ndc = new THREE.Vector2((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
  const renderer = sceneEl.renderer;
  const cam = (renderer && renderer.xr && renderer.xr.isPresenting) ? renderer.xr.getCamera() : sceneEl.camera;
  if (!cam) return;
  raycaster.setFromCamera(ndc, cam);
  const meshes = [], map = new Map();
  units.forEach((u) => [u.plane, u.frame].forEach((e) => { const m = e.getObject3D('mesh'); if (m) { meshes.push(m); map.set(m, { type: 'poster', ref: u }); } }));
  floaters.forEach((f) => { if (f.kind === 'spot') f.wrapper.traverse((o) => { if (o.isMesh) { meshes.push(o); map.set(o, { type: 'spot', ref: f }); } }); });
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length) { const h = map.get(hits[0].object); openCard(h.type, h.ref); }
}
(function setupTap() {
  const layer = $('#tapLayer');
  let down = null;
  layer.addEventListener('pointerdown', (e) => { down = { id: e.pointerId, t: performance.now(), lx: e.clientX, ly: e.clientY, moved: 0 }; });
  layer.addEventListener('pointermove', (e) => {
    if (!down || e.pointerId !== down.id) return;
    const dx = e.clientX - down.lx, dy = e.clientY - down.ly;
    down.lx = e.clientX; down.ly = e.clientY; down.moved += Math.abs(dx) + Math.abs(dy);
    if (!gyro.has && state.running && !state.arActive) {
      look.yaw += dx * 0.006; look.pitch = clamp(look.pitch + dy * 0.006, -1.3, 1.3);
    }
  });
  layer.addEventListener('pointerup', (e) => {
    if (!down) return;
    const d = down; down = null;
    if (d.moved < 12 && performance.now() - d.t < 700) handleTap(e.clientX, e.clientY);
  });
  layer.addEventListener('pointercancel', () => { down = null; });
})();

/* ============================================================
   15. カード（ポスターや見どころをタップしたとき）
   ============================================================ */
function renderCard() {
  const c = state.card; if (!c) return;
  const img = $('#cardImg');
  if (c.type === 'poster') {
    const u = c.ref, d = u.data;
    $('#cardNo').textContent = 'No.' + String(u.i + 1).padStart(2, '0');
    $('#cardTitle').textContent = pickP(d, 'title') || '';
    $('#cardAuthor').textContent = t('card.by') + (pickP(d, 'author') || '');
    $('#cardAuthor').style.display = 'block';
    $('#cardDesc').textContent = pickP(d, 'description') || '';
    if (u.cardSrc) { img.src = u.cardSrc; img.style.display = 'block'; } else img.style.display = 'none';
  } else {
    const s = pickS(LOCAL_SPOTS[c.ref.model]);
    $('#cardNo').textContent = t('card.spotTag');
    $('#cardTitle').textContent = s.name; $('#cardDesc').textContent = s.desc;
    $('#cardAuthor').style.display = 'none'; img.style.display = 'none';
  }
}
function openCard(type, ref) { state.card = { type: type, ref: ref }; renderCard(); $('#card').classList.add('show'); }
function closeCard() { $('#card').classList.remove('show'); state.card = null; }
$('#cardClose').addEventListener('click', closeCard);
$('#card').addEventListener('click', (e) => { if (e.target === $('#card')) closeCard(); });

/* ============================================================
   16. 言語の切りかえ
   ============================================================ */
function renderStartBtn() { $('#startBtn').textContent = t(state.startLabel); }
function renderBgmBtn() {
  $('#bgmBtnText').textContent = t(state.bgmOn ? 'menu.bgmOn' : 'menu.bgmOff');
  $('#bgmBtn').setAttribute('aria-pressed', String(state.bgmOn));
}
function renderBackBtn() { $('#backBtn').textContent = t(state.backward ? 'menu.backOn' : 'menu.backOff'); }
function setLang(lang, save) {
  state.lang = lang;
  if (save) store.set('lang', lang);
  document.documentElement.lang = lang;
  document.title = lang === 'ja' ? 'WebARポスターギャラリー' : 'WebAR Poster Gallery';
  $$('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  $$('[data-lang]').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
  $('#startTitle').textContent = EXHIBITION_TITLE[lang] || EXHIBITION_TITLE.ja;
  $('#startSub').textContent = EXHIBITION_SUB[lang] || EXHIBITION_SUB.ja;
  renderBadge(); renderDiag(); renderStartBtn(); renderBgmBtn(); renderBackBtn(); renderCard();
  units.forEach((u) => {                          // 仮ポスターは、言語に合わせて作りなおす
    if (u.placeholder) fontsReady().then(() => {
      const src = makePlaceholderDataURL(u.i, pickP(u.data, 'title'), pickP(u.data, 'author'));
      u.plane.setAttribute('material', { src: src, shader: 'flat' }); u.cardSrc = src;
    });
  });
}

/* ============================================================
   17. ボタン・メニュー・スティックの動き
   ============================================================ */
$$('#layoutBar button').forEach((b) => b.addEventListener('click', () => applyLayout(b.dataset.layout, false)));

function openMenu() { state.menuOpen = true; $('#menu').classList.add('open'); }
function closeMenu() { state.menuOpen = false; $('#menu').classList.remove('open'); }
$('#menuBtn').addEventListener('click', () => (state.menuOpen ? closeMenu() : openMenu()));
$('#menuClose').addEventListener('click', closeMenu);
$('#menuBackdrop').addEventListener('click', closeMenu);

document.addEventListener('click', (e) => {       // 言語・昼夜のボタン（スタート画面とメニューの両方）
  const lb = e.target.closest('[data-lang]'); if (lb) { setLang(lb.dataset.lang, true); return; }
  const tb = e.target.closest('[data-theme-set]'); if (tb) applyTheme(tb.dataset.themeSet, true);
});
$('#recenterBtn').addEventListener('click', () => { recenter(); closeMenu(); showToast(t('toast.recentered'), 2800); });
$('#backBtn').addEventListener('click', () => {
  state.backward = !state.backward;
  $('#backBtn').setAttribute('aria-pressed', String(state.backward)); renderBackBtn();
});
$('#bgmBtn').addEventListener('click', () => {
  state.bgmOn = !state.bgmOn; store.set('bgm', state.bgmOn ? 'on' : 'off');
  if (state.bgmOn) bgm.start(); else bgm.stop();
  renderBgmBtn();
});
$('#bgmVol').addEventListener('input', (e) => {
  state.vol = clamp(Number(e.target.value) / 100, 0, 1); store.set('vol', String(state.vol)); bgm.setVolume(state.vol);
});

(function setupStick() {
  const base = $('#stick'), knob = $('#stickKnob'), R = 42;
  let id = null;
  function set(e) {
    const r = base.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > R) { dx *= R / d; dy *= R / d; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    let x = dx / R, y = -dy / R;
    if (Math.hypot(x, y) < 0.1) { x = 0; y = 0; }
    state.stick.x = x; state.stick.y = y;
  }
  base.addEventListener('pointerdown', (e) => { id = e.pointerId; base.setPointerCapture(id); set(e); e.preventDefault(); });
  base.addEventListener('pointermove', (e) => { if (e.pointerId === id) set(e); });
  const end = (e) => { if (e.pointerId === id) { id = null; state.stick.x = 0; state.stick.y = 0; knob.style.transform = 'translate(0,0)'; } };
  base.addEventListener('pointerup', end); base.addEventListener('pointercancel', end);
})();

// AR中の「画面タップがARの操作として横取りされる」のを止める（UI部品すべて）
uiEl.addEventListener('beforexrselect', (e) => e.preventDefault());
$$('#ui .ui-part, #tapLayer').forEach((el) => el.addEventListener('beforexrselect', (e) => e.preventDefault()));

/* ============================================================
   18. スタートボタン
   ============================================================ */
$('#startBtn').addEventListener('click', async () => {
  if (state.started) return;
  state.started = true;
  $('#startBtn').disabled = true; state.startLabel = 'start.busy'; renderStartBtn();

  const permP = requestSensorPermissions();       // iPhone の許可は、ボタンを押した直後に聞く
  if (state.bgmOn) bgm.start();                    // BGMも、ボタンを押した直後でないと鳴らせない

  if (!arInfo) arInfo = await arPromise;
  if (arInfo.ok) {
    setBadge('mode.ar', [arInfo.why]);
    const ok = await tryEnterAR();
    if (ok) return;
    await startCameraMode(permP, ['why.arFailed']);
  } else {
    await startCameraMode(permP, [arInfo.why, 'why.camTail']);
  }
});

/* ============================================================
   19. 起動
   ============================================================ */
const arPromise = checkAR().then((r) => { arInfo = r; applyArInfoToBadge(r); renderDiag(); return r; });

POSTERS.forEach((p, i) => units.push(createPosterUnit(i, p)));
FLOATERS.forEach((f) => floaters.push(createBasicFloater(floaters.length, f)));
LOCAL_FLOATERS.forEach((f) => { const s = createSpotFloater(floaters.length, f); if (s) floaters.push(s); });
applyLayout('circle', true);

$('#bgmVol').value = String(Math.round(state.vol * 100));
bgm.setVolume(state.vol);
setLang(state.lang, false);
applyTheme(state.theme, false);

function afterSceneLoaded() {
  try { sceneEl.renderer.setClearColor(0x000000, 0); } catch (e) {}   // 背景は透明（現実の映像を見せる）
  applyTheme(state.theme, false);                                       // 読みこみ後にも、もう一度あかりを合わせる
}
if (sceneEl.hasLoaded) afterSceneLoaded(); else sceneEl.addEventListener('loaded', afterSceneLoaded);

})();
</script>
