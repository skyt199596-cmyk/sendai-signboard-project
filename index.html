<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>薩摩川内 街角看板探訪マップ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-x pan-y pinch-zoom;
    }

    .viewport {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* 霧用キャンバス（タッチイベントを邪魔しないよう pointer-events: none） */
    #fogCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }

    .world {
      position: absolute;
      width: 1800px;
      height: 1800px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-image: 
        radial-gradient(circle, rgba(255,204,0,0.2) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 30px 30px, 60px 60px, 60px 60px;
      will-change: transform;
    }

    .center-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      width: 280px;
    }

    .center-title h1 {
      font-size: 1.8rem;
      letter-spacing: 0.05em;
      margin: 0 0 8px 0;
      color: #ffcc00;
      text-shadow: 0 0 10px rgba(255,204,0,0.5);
    }

    .center-title p {
      color: #aaa;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .signboard-card {
      position: absolute;
      width: 200px;
      padding: 16px;
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(255, 204, 0, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      will-change: transform;
      transition: border-color 0.2s, transform 0.1s ease-out;
      z-index: 10;
    }

    .signboard-card:active {
      border-color: #ffcc00;
      transform: scale(0.96) !important;
    }

    .signboard-img {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .signboard-card h3 {
      margin: 0 0 4px 0;
      font-size: 1rem;
      color: #fff;
    }

    .signboard-card .tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 8px;
      background-color: rgba(255, 204, 0, 0.15);
      color: #ffcc00;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .signboard-card p {
      margin: 0;
      font-size: 0.75rem;
      color: #ccc;
      line-height: 1.4;
    }

    .spot-1 { top: 38%; left: 35%; }
    .spot-2 { top: 30%; left: 62%; }
    .spot-3 { top: 62%; left: 32%; }
    .spot-4 { top: 58%; left: 65%; }

    .hud-controls {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
    }

    .btn-recenter {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffcc00;
      color: #000;
      border: none;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 4px 16px rgba(255,204,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="viewport" id="viewport">
    <canvas id="fogCanvas"></canvas>

    <div class="world" id="world">
      <div class="center-title">
        <h1>薩摩川内<br>看板探訪MAP</h1>
        <p>指でドラッグ＆ピンチでズーム<br>気になる看板をタップしてみよう</p>
      </div>

      <div class="signboard-card spot-1 js-card">
        <div class="signboard-img" style="background: linear-gradient(135deg, #ff5e62, #ff9966); display: flex; align-items: center; justify-content: center; font-weight: bold;">レトロ居酒屋</div>
        <span class="tag">向田本町エリア</span>
        <h3>昭和風情のネオン看板</h3>
        <p>夜になると味わい深い光を放つ、創業40年の老舗居酒屋のシンボル。</p>
      </div>

      <div class="signboard-card spot-2 js-card">
        <div class="signboard-img" style="background: linear-gradient(135deg, #42e695, #3bb2b8); display: flex; align-items: center; justify-content: center; font-weight: bold;">モダンカフェ</div>
        <span class="tag">川内駅前エリア</span>
        <h3>鉄文字のシンプル看板</h3>
        <p>昼の光と夜の影で表情が変わる、スタイリッシュな切り文字デザイン。</p>
      </div>

      <div class="signboard-card spot-3 js-card">
        <div class="signboard-img" style="background: linear-gradient(135deg, #f857a6, #ff5858); display: flex; align-items: center; justify-content: center; font-weight: bold;">うなぎ専門店</div>
        <span class="tag">国道沿いエリア</span>
        <h3>木彫り墨文字看板</h3>
        <p>重厚感あふれる一枚板に手書きされた、歴史を感じる職人技の看板。</p>
      </div>

      <div class="signboard-card spot-4 js-card">
        <div class="signboard-img" style="background: linear-gradient(135deg, #abecd6, #fbed96); color:#333; display: flex; align-items: center; justify-content: center; font-weight: bold;">スイーツショップ</div>
        <span class="tag">山形屋周辺</span>
        <h3>手書きイラスト看板</h3>
        <p>季節ごとに描き直される、アットホームなスタンド型のイラスト板。</p>
      </div>
    </div>
  </div>

  <div class="hud-controls">
    <button class="btn-recenter" id="recenterBtn">🎯</button>
  </div>

  <script>
    const viewport = document.getElementById('viewport');
    const world = document.getElementById('world');
    const recenterBtn = document.getElementById('recenterBtn');
    const fogCanvas = document.getElementById('fogCanvas');
    const ctx = fogCanvas.getContext('2d');

    // 画面リサイズ対応
    function resizeCanvas() {
      fogCanvas.width = window.innerWidth;
      fogCanvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 座標・スケール管理
    let currentX = 0, currentY = 0, targetX = 0, targetY = 0;
    let currentScale = 1, targetScale = 1;

    // タッチ・ピンチ操作管理
    let isDragging = false;
    let startX = 0, startY = 0, lastX = 0, lastY = 0;
    let initialPinchDistance = null, initialScale = 1;

    // 霧パーティクル配列
    const fogParticles = [];

    function addFog(x, y) {
      // 触れた位置に数個の小さな霧粒子を生成
      for (let i = 0; i < 2; i++) {
        fogParticles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y + (Math.random() - 0.5) * 20,
          radius: 20 + Math.random() * 25,
          alpha: 0.18, // 薄く邪魔にならない濃度
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4 - 0.2 // かすかに上へたなびく
        });
      }
    }

    function getDistance(touch1, touch2) {
      return Math.hypot(touch1.clientX - touch2.clientX, touch1.clientY - touch2.clientY);
    }

    // タッチ開始
    viewport.addEventListener('touchstart', (e) => {
      for (let i = 0; i < e.touches.length; i++) {
        addFog(e.touches[i].clientX, e.touches[i].clientY);
      }

      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - lastX;
        startY = e.touches[0].clientY - lastY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = getDistance(e.touches[0], e.touches[1]);
        initialScale = targetScale;
      }
    }, { passive: true });

    // タッチ移動（スクロール中・ピンチインアウト中も発生）
    viewport.addEventListener('touchmove', (e) => {
      // すべての指の位置に霧を発生させる
      for (let i = 0; i < e.touches.length; i++) {
        addFog(e.touches[i].clientX, e.touches[i].clientY);
      }

      if (e.touches.length === 1 && isDragging) {
        targetX = e.touches[0].clientX - startX;
        targetY = e.touches[0].clientY - startY;
        targetX = Math.max(-800, Math.min(800, targetX));
        targetY = Math.max(-800, Math.min(800, targetY));
      } else if (e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = getDistance(e.touches[0], e.touches[1]);
        const factor = currentDistance / initialPinchDistance;
        targetScale = Math.max(0.5, Math.min(2.5, initialScale * factor));
      }
    }, { passive: true });

    viewport.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = null;
      if (e.touches.length === 0) {
        isDragging = false;
        lastX = targetX;
        lastY = targetY;
      }
    });

    // PCでのテスト用（マウス操作時も霧を発生）
    viewport.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) addFog(e.clientX, e.clientY);
    });

    recenterBtn.addEventListener('click', () => {
      targetX = 0; targetY = 0; lastX = 0; lastY = 0; targetScale = 1;
    });

    // メインアニメーション描画（マップ移動＋霧の更新）
    function animate() {
      // 1. マップ移動
      currentX += (targetX - currentX) * 0.1;
      currentY += (targetY - currentY) * 0.1;
      currentScale += (targetScale - currentScale) * 0.1;
      world.style.transform = `translate(calc(-50% + ${currentX}px), calc(-50% + ${currentY}px)) scale(${currentScale})`;

      // 2. 霧の描画更新
      ctx.clearRect(0, 0, fogCanvas.width, fogCanvas.height);
      for (let i = fogParticles.length - 1; i >= 0; i--) {
        const p = fogParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.radius += 0.4; // じわっと広がる
        p.alpha -= 0.004; // 徐々に消える

        if (p.alpha <= 0) {
          fogParticles.splice(i, 1);
          continue;
        }

        // 円形グラデーションでソフトな霧を描く
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
        grad.addColorStop(0, `rgba(255, 255, 255, ${p.alpha})`);
        grad.addColorStop(0.6, `rgba(255, 204, 0, ${p.alpha * 0.3})`); // 薩摩川内カラーのほんのり黄色
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
