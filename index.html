<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>薩摩川内 街角看板探訪マップ</title>
  <style>
    :root {
      --bg-color: #0c0e12;
      --card-bg: rgba(22, 27, 34, 0.88);
      --card-border: rgba(255, 204, 0, 0.3);
      --text-main: #ffffff;
      --text-sub: #ccc;
      --grid-color: rgba(255,255,255,0.03);
    }

    body.day-mode {
      --bg-color: #eef2f5;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(0, 150, 255, 0.3);
      --text-main: #1a1a1a;
      --text-sub: #555555;
      --grid-color: rgba(0,0,0,0.05);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-x pan-y pinch-zoom;
      transition: background-color 0.5s ease;
    }

    .viewport {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    #fogCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }

    /* 遠景（奥深くの背景層） */
    .parallax-bg {
      position: absolute;
      width: 3000px;
      height: 3000px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-image: 
        radial-gradient(circle, rgba(255,204,0,0.12) 1px, transparent 1px),
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 60px 60px, 120px 120px, 120px 120px;
      pointer-events: none;
      will-change: transform;
    }

    /* 中景（メインマップ層） */
    .world {
      position: absolute;
      width: 2600px;
      height: 2600px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      will-change: transform;
    }

    /* 近景（目の前の手前層） */
    .parallax-fg {
      position: absolute;
      width: 2200px;
      height: 2200px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 40;
      will-change: transform;
    }

    .center-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      width: 320px;
      transition: filter 0.3s, opacity 0.3s;
    }

    .center-title h1 {
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      letter-spacing: 0.05em;
      margin: 0 0 8px 0;
      color: #ffcc00;
      text-shadow: 0 0 12px rgba(255,204,0,0.5);
    }

    body.day-mode .center-title h1 {
      color: #0077ff;
      text-shadow: 0 0 12px rgba(0,119,255,0.3);
    }

    /* 階層1：エリアバッジ（距離感を離すため広めに配置） */
    .area-badge {
      position: absolute;
      padding: 12px 24px;
      background: rgba(255, 204, 0, 0.15);
      border: 2px solid #ffcc00;
      border-radius: 40px;
      color: #ffcc00;
      font-weight: bold;
      font-size: 1.1rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(255,204,0,0.3);
      transition: filter 0.3s ease, opacity 0.3s ease;
      pointer-events: none;
    }

    body.day-mode .area-badge {
      background: rgba(0, 119, 255, 0.15);
      border-color: #0077ff;
      color: #0077ff;
    }

    .area-1 { top: 22%; left: 22%; }
    .area-2 { top: 18%; left: 72%; }
    .area-3 { top: 75%; left: 18%; }
    .area-4 { top: 72%; left: 75%; }

    /* 看板カード（中景） */
    .signboard-card {
      position: absolute;
      width: clamp(200px, 45vw, 250px);
      padding: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      will-change: transform, filter, opacity;
      transition: border-color 0.3s, background 0.5s, box-shadow 0.3s, filter 0.3s ease, opacity 0.3s ease;
      z-index: 10;
    }

    .signboard-img {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .signboard-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .signboard-card h3 {
      margin: 0 0 4px 0;
      font-size: 1rem;
      color: var(--text-main);
    }

    .signboard-card .tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 8px;
      background-color: rgba(255, 204, 0, 0.15);
      color: #ffcc00;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .detail-info {
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.4s ease, max-height 0.4s ease, margin-top 0.4s ease;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .detail-info p {
      margin: 6px 0 0 0;
      line-height: 1.4;
    }

    .detail-spec {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      padding: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      font-size: 0.7rem;
    }

    .signboard-card.is-deep-detail .detail-info {
      opacity: 1;
      max-height: 200px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    /* 階層間隔を広げた配置 */
    .spot-1 { top: 32%; left: 28%; }
    .spot-2 { top: 25%; left: 62%; }
    .spot-3 { top: 68%; left: 24%; }
    .spot-4 { top: 64%; left: 66%; }

    /* 散りばめオブジェクト（中景） */
    .deco-object {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      border-radius: 12px;
      will-change: transform, filter, opacity;
      transition: filter 0.3s ease, opacity 0.3s ease;
    }
    .obj-1 { top: 15%; left: 15%; width: 70px; height: 70px; background: rgba(255,0,127,0.15); border: 1px solid #ff007f; transform: rotate(15deg); }
    .obj-2 { top: 12%; left: 82%; width: 80px; height: 80px; background: rgba(0,242,254,0.15); border: 1px solid #00f2fe; border-radius: 50%; }
    .obj-3 { top: 82%; left: 12%; width: 60px; height: 60px; background: rgba(255,204,0,0.15); border: 1px solid #ffcc00; transform: rotate(-25deg); }
    .obj-4 { top: 85%; left: 82%; width: 90px; height: 60px; background: rgba(121,40,202,0.15); border: 1px solid #7928ca; border-radius: 30px; }

    /* 最手前（カメラ直前）のオブジェクト群 */
    .fg-obj {
      position: absolute;
      font-size: 5rem;
      opacity: 0.6;
      filter: blur(2px);
      pointer-events: none;
      transition: opacity 0.3s ease, filter 0.3s ease;
      will-change: transform, opacity, filter;
    }
    .fg-1 { top: 20%; left: 42%; }
    .fg-2 { top: 62%; left: 48%; }
    .fg-3 { top: 40%; left: 18%; }
    .fg-4 { top: 50%; left: 80%; }

    /* 右下UI */
    .hud-menu-container {
      position: fixed;
      bottom: clamp(20px, 5vw, 30px);
      right: clamp(20px, 5vw, 30px);
      z-index: 100;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 12px;
    }

    .btn-hud {
      width: 52px;
      height: 52px;
      border-radius: 50%;
